name: Refresh spawn data

# OSRS game updates: Wednesdays ~11:30 UK. Run Fridays so the wiki has time to settle.
on:
  schedule:
    - cron: '0 3 * * 5'
  workflow_dispatch:
    inputs:
      note:
        description: Optional note to include in the PR body
        required: false
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv python install 3.11
      - run: uv sync
      - name: Run scraper
        run: |
          uv run python -m osrs_spawn_scraper \
            --output data/spawn_items.json \
            --cache data/cache.json
      - name: Open PR if data changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore(data): refresh spawn data'
          title: 'chore(data): refresh spawn data'
          body: |
            ${{ github.event_name == 'workflow_dispatch' && format('Manual refresh triggered by @{0}.', github.actor) || 'Scheduled Friday refresh (after Wednesday game updates).' }}

            Updates `data/spawn_items.json`.
            ${{ inputs.note && format('Note: {0}', inputs.note) || '' }}
          branch: refresh-data
          add-paths: |
            data/spawn_items.json
