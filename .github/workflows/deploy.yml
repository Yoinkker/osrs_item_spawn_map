name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv python install 3.11
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: data/icons
          key: icons-${{ hashFiles('data/spawn_items.json') }}
      - run: pnpm check

  worker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Deploy Worker
        run: |
          if [ -z "${WORKER_ALLOWED_ORIGINS}" ]; then
            echo "::error::Set the WORKER_ALLOWED_ORIGINS repository variable (comma-separated origins)."
            exit 1
          fi
          pnpm exec wrangler deploy \
            --var "ALLOWED_ORIGINS:${WORKER_ALLOWED_ORIGINS}"
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_ALLOWED_ORIGINS: ${{ vars.WORKER_ALLOWED_ORIGINS }}

  frontend:
    needs: [check, worker]
    runs-on: ubuntu-latest
    env:
      VITE_WORKER_URL: ${{ vars.WORKER_URL }}
      REQUIRE_VITE_WORKER_URL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv python install 3.11
      - run: uv sync
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: data/icons
          key: icons-${{ hashFiles('data/spawn_items.json') }}
      - name: Require WORKER_URL
        run: |
          if [ -z "${VITE_WORKER_URL}" ]; then
            echo "::error::Set the WORKER_URL repository variable before deploying."
            exit 1
          fi
      - run: pnpm build
        working-directory: frontend
      - name: Ensure Pages project exists
        run: pnpm exec wrangler pages project create osrs-spawn-map --production-branch=main
        working-directory: frontend
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Pages
        run: pnpm exec wrangler pages deploy dist --project-name=osrs-spawn-map
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
