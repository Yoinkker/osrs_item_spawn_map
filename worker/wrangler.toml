name = "osrs-spawn-map-worker"
main = "src/index.ts"
compatibility_date = "2025-07-18"
workers_dev = false

[observability]
enabled = true

[triggers]
crons = ["17 * * * *"]

[vars]
ALLOWED_ORIGINS = ""

[[kv_namespaces]]
binding = "TILE_VERSION_KV"
id = "fa7da62fd4904b2c9e2c95312c5acf71"

[[durable_objects.bindings]]
name = "WIKI_CALLS"
class_name = "WikiCallCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WikiCallCounter"]
