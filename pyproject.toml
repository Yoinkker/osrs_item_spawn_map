[project]
name = "osrs-spawn-map"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["osrs-spawn-scraper[dev]"]

[dependency-groups]
dev = ["ty>=0.0.39"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.sources]
osrs-spawn-scraper = { workspace = true }

[tool.uv.workspace]
members = ["scraper"]
